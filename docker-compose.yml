version: '3.8'

services:
  # ============================================
  # 1. Nginx 前端 + API 反向代理
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: ai-studio-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro          # 前端静态文件
      - ./api/public:/usr/share/nginx/public:ro  # API 静态资源（图片/视频/上传）
      - ./nginx.conf:/etc/nginx/nginx.conf:ro    # Nginx 配置
    depends_on:
      - backend
    networks:
      - app-network

  # ============================================
  # 2. Express 后端 API（Node.js）
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-studio-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./api/data:/app/api/data         # 持久化 JSON 数据
      - ./api/public:/app/api/public     # 静态资源共享
    depends_on:
      redis:
        condition: service_started
    networks:
      - app-network

  # ============================================
  # 3. Redis 缓存 + 会话存储
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ai-studio-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - app-network

  # ============================================
  # 4. Python LTX 视频微服务（可选，需 GPU）
  # ============================================
  ltx-server:
    build:
      context: ./ltx-video-server
      dockerfile: Dockerfile.ltx
    container_name: ai-studio-ltx
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LTX_REPO_DIR=/app/LTX-Video
      - LTX_OUTPUT_DIR=/app/outputs
    volumes:
      - ltx_outputs:/app/outputs
      - ./LTX-Video:/app/LTX-Video:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu  # 默认不启动，需 --profile gpu
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  ltx_outputs:
