version: '3.8'

services:
  # ============================================
  # 1. Express 后端 API（Node.js）
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-studio-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./api/data:/app/api/data         # 持久化 JSON 数据
      - ./api/public:/app/api/public     # 静态资源（图片/视频）
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 2. Nginx 前端 + API 反向代理
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-studio-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./api/public:/usr/share/nginx/public:ro  # 共享静态资源
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  # ============================================
  # 3. Python LTX 视频微服务（可选，需 GPU）
  # 启动方式: docker compose --profile gpu up -d
  # ============================================
  ltx-server:
    build:
      context: ./ltx-video-server
      dockerfile: Dockerfile.ltx
    container_name: ai-studio-ltx
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LTX_REPO_DIR=/app/LTX-Video
      - LTX_OUTPUT_DIR=/app/outputs
    volumes:
      - ltx_outputs:/app/outputs
      - ./LTX-Video:/app/LTX-Video:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu  # 默认不启动，需 --profile gpu
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ltx_outputs:
